<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORY MODE // AGENT LIST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Rajdhani:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/select.css">
  <link rel="stylesheet" href="css/story.css">
  <link rel="stylesheet" href="css/formation.css">
  <link rel="stylesheet" href="css/battle.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <!-- 1920 x 920 고정 캔버스 (기존 사이트와 동일한 기준 해상도 · 균일 스케일) -->
  <div id="viewport">
    <div id="stage" class="g-canvas">
      <div id="screen-root"></div>
      <div id="fx-root"></div>
    </div>
  </div>

  <div class="g-rotate-notice">가로모드 화면에서 플레이해 주세요</div>
  <div id="g-tooltip" class="g-tooltip" role="tooltip"></div>

  <!-- 공통 SVG 심볼 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-back" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"><path d="M16 4 7 12l9 8"/></g>
      <g id="i-lock" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="M5.4 10.4h13.2v10.2H5.4z"/><path d="M8.4 10.4V7.2a3.6 3.6 0 0 1 7.2 0v3.2"/></g>
      <g id="i-speed" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"><path d="M3 5l8 7-8 7z"/><path d="M12 5l8 7-8 7z"/></g>
      <g id="i-auto" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v5h-5"/></g>
      <g id="i-swap" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"><path d="M4 8h14l-4-4"/><path d="M20 16H6l4 4"/></g>
      <g id="i-pause" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 5v14M15 5v14"/></g>
      <g id="i-skip" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"><path d="M4 5l9 7-9 7z"/><path d="M18 5v14"/></g>
      <g id="i-target" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></g>
    </defs>
  </svg>

  <!-- 데이터 (챕터·캐릭터 추가 시 이 파일들만 수정) -->
  <script src="js/data/statuses.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/enemies.js"></script>
  <script src="js/data/stories.js"></script>
  <script src="js/data/chapters.js"></script>
  <!-- 코어 -->
  <script src="js/core/util.js"></script>
  <script src="js/core/art.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/tooltip.js"></script>
  <script src="js/core/router.js"></script>
  <!-- 시스템 (화면과 분리된 순수 게임 로직) -->
  <script src="js/systems/battle-engine.js"></script>
  <!-- 화면 -->
  <script src="js/screens/chapter-select.js"></script>
  <script src="js/screens/chapter-map.js"></script>
  <script src="js/screens/story.js"></script>
  <script src="js/screens/formation.js"></script>
  <script src="js/screens/battle-fx.js"></script>
  <script src="js/screens/battle-ui.js"></script>
  <script src="js/screens/tutorial.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
